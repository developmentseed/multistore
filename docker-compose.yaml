services:
  # ── RustFS (backing object store) ─────────────────────────────────────
  # MinIO no longer publishes public images; RustFS is an S3-compatible
  # drop-in that takes the same static credentials.
  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Seed RustFS with example buckets and data ─────────────────────────
  rustfs-init:
    image: amazon/aws-cli:2.37.2
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        s3() { aws --endpoint-url http://rustfs:9000 s3 "$$@"; }
        for b in public-data private-uploads; do
          s3 ls "s3://$$b" >/dev/null 2>&1 || s3 mb "s3://$$b"
        done
        echo "Hello from s3-proxy!" | s3 cp - s3://public-data/hello.txt
        echo '{"status":"ok"}' | s3 cp - s3://public-data/health.json
        echo "Secret payload" | s3 cp - s3://private-uploads/docs/secret.txt

volumes:
  rustfs-data:
